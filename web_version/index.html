<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digit Studio · 손글씨 인식</title>
<style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#142c36;background:#edf2f1}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:48px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:800;letter-spacing:-1px;font-size:24px}.pill{color:#08766c;font-size:12px;background:#dceee8;padding:9px 14px;border-radius:30px}h1{font-size:38px;letter-spacing:-2px;margin:0 0 12px}p{color:#65777e;line-height:1.8}.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;margin-top:30px}.card{background:#fff;border:1px solid #dce5e2;border-radius:22px;padding:26px}.label{font-size:12px;letter-spacing:2px;color:#718781;font-weight:700}.canvasbox{margin:20px auto;max-width:336px;position:relative}#draw{display:block;width:100%;aspect-ratio:1;background:#fff;border:2px dashed #bdceca;border-radius:12px;touch-action:none;cursor:crosshair}button{border:0;border-radius:12px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;background:#edf2f1;color:#253e40}button.primary{background:#087c70;color:white;flex:1}button:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:12px}.hint{font-size:12px;text-align:center;margin-bottom:0}.prediction{display:flex;align-items:center;gap:24px;margin:18px 0}#digit{font-size:104px;font-weight:750;line-height:1.2;min-width:95px;color:#087c70}#confidence{font-size:22px;font-weight:700}.muted{font-size:12px;color:#768880}#preview{width:56px;height:56px;image-rendering:pixelated;background:#102623;border-radius:6px}.barrow{display:grid;grid-template-columns:18px 1fr 52px;align-items:center;gap:12px;margin:11px 0;font-size:12px}.track{height:8px;background:#edf3f1;border-radius:8px;overflow:hidden}.bar{height:100%;background:#b8ccc6;border-radius:8px;transition:width .25s}.bar.best{background:#087c70}.pct{text-align:right;color:#62756e}#status{min-height:45px;font-size:13px;margin:10px 0;color:#576e65}.footer{margin-top:24px;font-size:12px;color:#71827b} @media(max-width:720px){main{margin:24px auto;padding:0 16px}.grid{grid-template-columns:1fr}h1{font-size:30px}.card{padding:20px}.pill{font-size:10px}}
</style></head><body><main><header><div class="brand">Digit Studio<span style="color:#0b8b79">.</span></div><span class="pill">MNIST · 내 PC에서 인식</span></header><h1>손으로 쓴 숫자를 읽어요.</h1><p>0부터 9까지 숫자 하나를 그려 주세요.<br>학습한 신경망이 숫자와 예측 점수를 보여 드립니다.</p><div class="grid"><section class="card"><div class="label">01 / DRAW A DIGIT</div><div class="canvasbox"><canvas id="draw" width="336" height="336" aria-label="숫자 그리기 영역"></canvas></div><div class="actions"><button id="clear">지우기</button><button class="primary" id="recognize">숫자 인식하기 →</button></div><p class="hint">마우스·터치로 입력 · Enter 인식 · Esc 지우기</p></section><section class="card"><div class="label">02 / PREDICTION</div><div class="prediction"><div id="digit">—</div><div><div id="confidence">입력 대기</div><p class="muted">모델의 예측 신뢰도</p><canvas id="preview" width="28" height="28" aria-label="전처리된 이미지"></canvas></div></div><div id="status" role="status" aria-live="polite">왼쪽에 숫자를 크게 그린 뒤 인식 버튼을 눌러 주세요.</div><div id="bars"></div></section></div><p class="footer">한 번에 숫자 하나만 인식합니다. 신뢰도는 모델 점수이며 정답 확률을 보장하지 않습니다. 입력 이미지는 저장하지 않습니다.</p></main>
<script>
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d'),preview=document.getElementById('preview'),pctx=preview.getContext('2d');
const digit=document.getElementById('digit'),confidence=document.getElementById('confidence'),status=document.getElementById('status'),run=document.getElementById('recognize'),clear=document.getElementById('clear'),bars=document.getElementById('bars');
let drawing=false,ink=false,revision=0,busy=false;
for(let i=0;i<10;i++){const row=document.createElement('div');row.className='barrow';row.innerHTML=`<b>${i}</b><div class="track"><div class="bar" id="bar${i}" style="width:0"></div></div><span class="pct" id="pct${i}">—</span>`;bars.append(row)}
function resetResult(){digit.textContent='—';confidence.textContent='입력 대기';pctx.clearRect(0,0,28,28);for(let i=0;i<10;i++){document.getElementById('bar'+i).style.width='0';document.getElementById('pct'+i).textContent='—'}}
function erase(){revision++;drawing=false;ink=false;ctx.fillStyle='white';ctx.fillRect(0,0,336,336);resetResult();status.textContent='숫자 하나를 크게 그려 주세요.'}
function position(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*336/r.width,(e.clientY-r.top)*336/r.height]}
canvas.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;ink=true;revision++;resetResult();status.textContent='인식 버튼을 누르면 결과를 확인할 수 있습니다.';const [x,y]=position(e);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=position(e);ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y)});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>drawing=false);
async function recognize(){if(busy)return;if(!ink){status.textContent='먼저 숫자를 그려 주세요.';return}busy=true;drawing=false;run.disabled=true;clear.disabled=true;const current=revision;status.textContent='숫자를 분석하고 있습니다…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:canvas.toDataURL('image/png')}),signal:controller.signal});const r=await response.json();if(!response.ok)throw new Error(r.error||'Recognition failed');if(current!==revision)return;digit.textContent=r.digit;confidence.textContent=(r.confidence*100).toFixed(1)+'%';status.textContent=r.confidence<.7?'점수가 낮습니다. 숫자를 지우고 더 또렷하게 써 보세요.':'인식 완료 · 아래에서 숫자별 예측 점수를 비교해 보세요.';for(let i=0;i<10;i++){const bar=document.getElementById('bar'+i);bar.style.width=r.probabilities[i]*100+'%';bar.className='bar'+(i===r.digit?' best':'');document.getElementById('pct'+i).textContent=(r.probabilities[i]*100).toFixed(1)+'%'}const im=pctx.createImageData(28,28);r.pixels.flat().forEach((v,i)=>{im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255});pctx.putImageData(im,0,0)}catch(e){status.textContent='인식 실패: '+(e.name==='AbortError'?'응답 시간이 초과되었습니다.':e.message)+' 실행 창을 확인해 주세요.'}finally{clearTimeout(timer);busy=false;run.disabled=false;clear.disabled=false}}
clear.onclick=erase;run.onclick=recognize;document.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();recognize()}if(e.key==='Escape'&&!busy)erase()});erase();
</script></body></html>
