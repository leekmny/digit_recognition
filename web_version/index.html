<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digit Studio · 손글씨 인식</title>
  <style>
    :root {
      --paper: #f8f5ec;
      --cream: #fffdf7;
      --ink: #202c29;
      --muted: #4c5a54;
      --rule: #b9b6a7;
      --track: #e9e6da;
      --accent: #215b4c;
      --accent-hover: #164337;
      font: 16px/1.55 system-ui, 'Malgun Gothic', sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    ::selection { color: var(--ink); background: #bce1d2; }
    main { max-width: 68rem; margin-inline: auto; padding: 0 2rem 2rem; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 1.5rem;
      padding: 1.5rem 0 1rem;
      border-bottom: 1px solid var(--rule);
    }
    .brand { font-size: 1.125rem; font-weight: 750; }
    .model { color: var(--muted); font-size: 0.8125rem; }
    .intro { margin: 2.25rem 0 1.75rem; }
    h1 { margin: 0; font-size: 2.375rem; line-height: 1.2; letter-spacing: -0.03em; }
    h2, h3 { margin: 0; font-size: 1rem; font-weight: 700; }
    .intro p { margin: 0.5rem 0 0; color: var(--muted); }
    .workspace {
      display: grid;
      grid-template-columns: 1.06fr minmax(0, 0.94fr);
      border-block: 1px solid var(--rule);
    }
    .input { padding: 1.375rem 2rem 1.125rem 0; }
    .output { border-left: 1px solid var(--rule); padding: 1.375rem 0 1.125rem 2rem; }
    .input h2, .output h2 { padding-bottom: 0.625rem; border-bottom: 1px solid var(--rule); }
    .canvasbox {
      position: relative;
      max-width: 22rem;
      margin: 1rem auto;
      padding: 7px;
      border: 1px solid var(--rule);
      background:
        repeating-linear-gradient(90deg, transparent 0 11px, var(--rule) 11px 12px) left top / 100% 5px no-repeat,
        repeating-linear-gradient(0deg, transparent 0 11px, var(--rule) 11px 12px) left top / 5px 100% no-repeat,
        var(--cream);
    }
    #draw { display: block; width: 100%; aspect-ratio: 1; touch-action: none; cursor: crosshair; }
    .actions { display: flex; gap: 0.625rem; max-width: 22rem; margin-inline: auto; }
    button {
      border: 1px solid var(--rule);
      border-radius: 4px;
      min-height: 44px;
      padding: 0.5rem 1rem;
      font: inherit;
      font-weight: 650;
      color: inherit;
      background: var(--cream);
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--track); }
    button.primary { flex: 1; background: var(--accent); border-color: var(--accent); color: white; }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .hint { margin: 0.625rem 0 0; text-align: center; }
    kbd { font-family: inherit; color: var(--ink); }
    .prediction {
      min-height: 7rem;
      margin-top: 0.625rem;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1.125rem;
    }
    #digit {
      min-width: 0.85em;
      color: var(--accent);
      font-size: 4.5rem;
      font-variant-numeric: tabular-nums;
      font-weight: 720;
      line-height: 1;
    }
    #confidence { font-size: 1.125rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .prediction p { margin: 0; }
    figure { margin: 0; text-align: center; }
    #preview {
      display: block;
      margin-inline: auto;
      width: 56px;
      height: 56px;
      image-rendering: pixelated;
      background: #202b28;
    }
    figcaption { margin-top: 0.25rem; }
    .hint, figcaption, .prediction p, .footer { color: var(--muted); font-size: 0.8125rem; }
    #status { min-height: 2.625rem; margin: 0 0 0.5rem; font-size: 0.875rem; color: var(--muted); }
    .barrow {
      display: grid;
      grid-template-columns: 1rem minmax(0, 1fr) 3.625rem;
      align-items: center;
      gap: 0.625rem;
      font-size: 0.8125rem;
      font-variant-numeric: tabular-nums;
      padding: 0.1875rem 0;
      border-bottom: 1px solid var(--track);
    }
    .track { height: 0.375rem; background: var(--track); overflow: hidden; }
    .bar { height: 100%; background: #779388; transition: width 180ms ease-out; }
    .bar.best { background: var(--accent); }
    .pct { text-align: right; color: var(--muted); }
    .footer { margin: 0.875rem 0 0; }
    @media (max-width: 720px) {
      main { padding: 0 1rem 1.5rem; }
      header { flex-wrap: wrap; padding-top: 1rem; }
      .intro { margin-top: 1.625rem; }
      h1 { font-size: 1.875rem; }
      .workspace { grid-template-columns: minmax(0, 1fr); }
      .input, .output { padding-inline: 0; }
      .output { border-top: 1px solid var(--rule); border-left: 0; }
    }
    @media (max-width: 370px) { .prediction { gap: 0.5rem; } }
    @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
  </style>
</head>
<body>
<main>
  <header>
    <span class="brand">Digit Studio</span>
    <span class="model">MNIST · 내 PC에서 인식</span>
  </header>
  <div class="intro">
    <h1>손글씨 숫자 인식</h1>
    <p>0부터 9까지 숫자 하나를 그려 주세요.</p>
  </div>
  <div class="workspace">
    <section class="input" aria-labelledby="draw-heading">
      <h2 id="draw-heading">숫자 그리기</h2>
      <div class="canvasbox">
        <canvas id="draw" width="336" height="336" aria-label="숫자 그리기 영역"></canvas>
      </div>
      <div class="actions">
        <button id="clear" type="button">지우기</button>
        <button class="primary" id="recognize" type="button">숫자 인식하기</button>
      </div>
      <p class="hint"><kbd>Enter</kbd> 인식 · <kbd>Esc</kbd> 지우기</p>
    </section>
    <section class="output" aria-labelledby="result-heading">
      <h2 id="result-heading">예측 결과</h2>
      <div class="prediction">
        <div id="digit">—</div>
        <div>
          <div id="confidence">입력 대기</div>
          <p>모델의 예측 신뢰도</p>
        </div>
        <figure>
          <canvas id="preview" width="28" height="28" aria-label="전처리된 이미지"></canvas>
          <figcaption>모델 입력 28×28</figcaption>
        </figure>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <h3>숫자별 모델 점수</h3>
      <div id="bars"></div>
    </section>
  </div>
  <p class="footer">신뢰도는 모델 점수이며 정답 확률을 보장하지 않습니다. 입력 이미지는 저장하지 않습니다.</p>
</main>
<script>
const canvas=document.getElementById('draw'),ctx=canvas.getContext('2d'),preview=document.getElementById('preview'),pctx=preview.getContext('2d');
const digit=document.getElementById('digit'),confidence=document.getElementById('confidence'),status=document.getElementById('status'),run=document.getElementById('recognize'),clear=document.getElementById('clear'),bars=document.getElementById('bars');
let drawing=false,ink=false,revision=0,busy=false;
for(let i=0;i<10;i++){const row=document.createElement('div');row.className='barrow';row.innerHTML=`<b>${i}</b><div class="track"><div class="bar" id="bar${i}" style="width:0"></div></div><span class="pct" id="pct${i}">—</span>`;bars.append(row)}
function resetResult(){digit.textContent='—';confidence.textContent='입력 대기';pctx.clearRect(0,0,28,28);for(let i=0;i<10;i++){const bar=document.getElementById('bar'+i);bar.style.width='0';bar.classList.remove('best');document.getElementById('pct'+i).textContent='—'}}
function erase(){revision++;drawing=false;ink=false;ctx.fillStyle='white';ctx.fillRect(0,0,336,336);resetResult();status.textContent='숫자 하나를 크게 그려 주세요.'}
function position(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*336/r.width,(e.clientY-r.top)*336/r.height]}
canvas.addEventListener('pointerdown',e=>{if(busy)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);drawing=true;ink=true;revision++;resetResult();status.textContent='인식 버튼을 누르면 결과를 확인할 수 있습니다.';const [x,y]=position(e);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(x,y)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const [x,y]=position(e);ctx.lineWidth=22;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(x,y)});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>drawing=false);
async function recognize(){if(busy)return;if(!ink){status.textContent='먼저 숫자를 그려 주세요.';return}busy=true;drawing=false;run.disabled=true;clear.disabled=true;const current=revision;status.textContent='숫자를 분석하고 있습니다…';const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);try{const response=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:canvas.toDataURL('image/png')}),signal:controller.signal});const r=await response.json();if(!response.ok)throw new Error(r.error||'Recognition failed');if(current!==revision)return;digit.textContent=r.digit;confidence.textContent=(r.confidence*100).toFixed(1)+'%';status.textContent=r.confidence<.7?'점수가 낮습니다. 숫자를 지우고 더 또렷하게 써 보세요.':'인식 완료 · 아래에서 숫자별 예측 점수를 비교해 보세요.';for(let i=0;i<10;i++){const bar=document.getElementById('bar'+i);bar.style.width=r.probabilities[i]*100+'%';bar.className='bar'+(i===r.digit?' best':'');document.getElementById('pct'+i).textContent=(r.probabilities[i]*100).toFixed(1)+'%'}const im=pctx.createImageData(28,28);r.pixels.flat().forEach((v,i)=>{im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255});pctx.putImageData(im,0,0)}catch(e){status.textContent='인식 실패: '+(e.name==='AbortError'?'응답 시간이 초과되었습니다.':e.message)+' 실행 창을 확인해 주세요.'}finally{clearTimeout(timer);busy=false;run.disabled=false;clear.disabled=false}}
clear.onclick=erase;run.onclick=recognize;document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();recognize()}if(e.key==='Escape'&&!busy)erase()});erase();
</script></body></html>
